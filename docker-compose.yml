# =============================================================================
# IJFK - docker-compose.yml
# Stack completo: Next.js + Supabase (Postgres)
# =============================================================================
#
# Servicios:
#   app       : Next.js 16 (puerto 3000)
#   db        : Postgres con extensiones de Supabase (puerto 54322)
#   pgadmin   : UI web para gestionar la base de datos (puerto 5050)
#   (El email se envía vía SMTP/Gmail — ver MAIL_USER/MAIL_PASSWORD en .env)
#
# Monitoreo de errores:
#   El SDK de @sentry/nextjs está instalado y configurado en la app.
#   Apunta a sentry.io (SaaS free tier). Configura SENTRY_DSN y
#   NEXT_PUBLIC_SENTRY_DSN en tu .env con el DSN de tu proyecto en
#   https://sentry.io. Si dejas los DSN vacíos, el SDK queda inactivo.
#
# Perfiles disponibles:
#   tools     : pgadmin, supabase-studio
#   production: optimiza la app para producción
#
# Uso:
#   docker compose up -d            # Levanta app + db
#   docker compose --profile tools up -d  # También pgadmin y studio
#   docker compose --profile production up -d  # Modo producción
# =============================================================================

name: ijfk

services:
  # ---------------------------------------------------------------------------
  # Next.js 16 (App)
  # ---------------------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_BUILD_ID: ${NEXT_BUILD_ID:-local}
        NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
        # Necesario en build-time: lib/session.ts valida JWT_SECRET al importarse
        # y "next build" importa las rutas API al recolectar datos de página.
        JWT_SECRET: ${JWT_SECRET:-ijfk_dev_jwt_secret_32_chars_min_xxxxxx}
    image: ijfk-app:latest
    container_name: ijfk-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # --- App ---
      NODE_ENV: ${NODE_ENV:-production}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      # --- Supabase (Postgres) ---
      # Apunta a la BD local por defecto (supabase_admin es el superuser de la imagen)
      DATABASE_URL: postgresql://${POSTGRES_USER:-supabase_admin}:${POSTGRES_PASSWORD:-ijfk_dev_password}@db:5432/${POSTGRES_DB:-ijfk}
      # Si usas Supabase Cloud, sobrescribe estas en tu .env:
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-http://localhost:54321}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:-local-anon-key}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-local-service-key}
      # --- Mail (SMTP / Gmail) ---
      # Se toman del .env. Para Gmail: MAIL_USER + MAIL_PASSWORD (app password).
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_SECURE: "${MAIL_SECURE:-false}"
      MAIL_USER: ${MAIL_USER:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-IJFK Sistema Institucional}
      # --- Seguridad ---
      NEXT_SERVER_ACTIONS_ENCRYPTION_KEY: ${NEXT_SERVER_ACTIONS_ENCRYPTION_KEY:-}
      # Define JWT_SECRET con >=32 chars aleatorios en producción (firma de la
      # cookie de sesión). Sin él, la app falla cerrada a propósito.
      JWT_SECRET: ${JWT_SECRET:-}
      # Pon TRUST_PROXY=1 SOLO si la app va detrás de un reverse proxy de
      # confianza (Nginx/Traefik/Vercel) que sobrescribe X-Forwarded-For.
      # Sin proxy, dejar en 0 para que los rate limits no sean evadibles.
      TRUST_PROXY: ${TRUST_PROXY:-0}
      # --- Sentry (SaaS - free tier en sentry.io) ---
      # Para activar el monitoreo:
      #   1. Crea un proyecto JS/Next en https://sentry.io
      #   2. Copia el DSN y pégalo en SENTRY_DSN y NEXT_PUBLIC_SENTRY_DSN
      #   3. Reinicia el contenedor: docker compose up -d --build app
      # Si dejas los DSN vacíos, el SDK queda inactivo (sin errores enviados).
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-local}
      SENTRY_RELEASE: ${SENTRY_RELEASE:-ijfk-app@${NEXT_BUILD_ID:-local}}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0.1}
      SENTRY_DEBUG: ${SENTRY_DEBUG:-false}
      # Client: NEXT_PUBLIC_ se inyecta al bundle del navegador
      NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
      NEXT_PUBLIC_SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-local}
      NEXT_PUBLIC_SENTRY_RELEASE: ${SENTRY_RELEASE:-ijfk-app@${NEXT_BUILD_ID:-local}}
      NEXT_PUBLIC_SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0.1}
      # Activar Sentry solo si el DSN está configurado (no rompe dev/tests sin él)
      NEXT_PUBLIC_SENTRY_ENABLED: ${NEXT_PUBLIC_SENTRY_ENABLED:-true}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - ijfk-net
    healthcheck:
      # 127.0.0.1 (IPv4) en vez de "localhost": wget resuelve localhost a ::1
      # (IPv6) y la app escucha en 0.0.0.0 (IPv4), así que el check fallaba con
      # "Connection refused" aunque la app respondía bien.
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # ---------------------------------------------------------------------------
  # Supabase - Postgres (imagen oficial con todas las extensiones)
  # Compatible 100% con el protocolo de Supabase Cloud
  #
  # La imagen supabase/postgres usa 'supabase_admin' como superuser.
  # POSTGRES_USER se mapea a supabase_admin en esta imagen.
  # ---------------------------------------------------------------------------
  db:
    image: supabase/postgres:15.8.1.085
    container_name: ijfk-db
    restart: unless-stopped
    ports:
      - "54322:5432"   # Puerto de Supabase self-hosted
    environment:
      # Por defecto usamos supabase_admin (superuser de la imagen Supabase)
      POSTGRES_USER: ${POSTGRES_USER:-supabase_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ijfk_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-ijfk}
      # Configuración de Supabase
      JWT_SECRET: ${SUPABASE_JWT_SECRET:-super-secret-jwt-token-with-at-least-32-characters-long}
      JWT_EXP: 3600
      ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:-local-anon-key}
      SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-local-service-key}
      DATABASE_BACKEND: "postgres"
    volumes:
      - supabase-db-data:/var/lib/postgresql/data
      - ./supabase/migrations:/docker-entrypoint-initdb.d:ro
    networks:
      - ijfk-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-supabase_admin} -d ${POSTGRES_DB:-ijfk}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  # ---------------------------------------------------------------------------
  # pgAdmin - UI para gestionar la BD (perfil: tools)
  # ---------------------------------------------------------------------------
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: ijfk-pgadmin
    restart: unless-stopped
    profiles: ["tools"]
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@ijfk.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_LISTEN_PORT: 80
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    networks:
      - ijfk-net
    depends_on:
      - db

# =============================================================================
# Volúmenes persistentes
# =============================================================================
volumes:
  supabase-db-data:
    name: ijfk-supabase-data
  pgadmin-data:
    name: ijfk-pgadmin-data

# =============================================================================
# Red interna
# =============================================================================
networks:
  ijfk-net:
    name: ijfk-net
    driver: bridge

